services:
  app:
    build: .
    container_name: myapp-app
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=myappdb;Username=myappuser;Password=myapppassword
    depends_on:
      - db
    networks:
      - internal

  db:
    image: postgres:16
    container_name: myapp-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=myappdb
      - POSTGRES_USER=myappuser
      - POSTGRES_PASSWORD=myapppassword
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
  nginx:
    image: nginx:alpine
    container_name: myapp-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
